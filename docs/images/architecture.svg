<svg viewBox="-10 -10 940 340" width="940" height="340" role="img" aria-label="Fregoli architecture: browser talks HTTP to the web plugin; the agent plugin runs Grok CLI over ACP; Grok spawns the Fregoli MCP server, which calls the web plugin&#x27;s HTTP API." xmlns="http://www.w3.org/2000/svg"><title>Fregoli architecture: browser talks HTTP to the web plugin; the agent plugin runs Grok CLI over ACP; Grok spawns the Fregoli MCP server, which calls the web plugin&#x27;s HTTP API.</title><style>svg{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.bg{fill:#f7f6f3}.dx-box{fill:#fff;stroke:#9a3b28;stroke-opacity:.8}.dx-box.s{fill:#9a3b28;stroke:#9a3b28}.dx-t{fill:#1c1c1e;font-size:15px;font-weight:600}.dx-s{fill:#66666e;font-size:12px}.dx-on{fill:#fff}.dx-sub-on{fill:#fff;opacity:.85;font-size:12px}.dx-reg{fill:none;stroke:#9a3b28;stroke-dasharray:6 6;stroke-opacity:.9}.dx-rl{fill:#9a3b28;font-size:13px;font-weight:600}.dx-a{stroke:#9a3b28;stroke-width:2;fill:none}.dx-a.d{stroke-dasharray:5 5}.dx-m{fill:#9a3b28}.dx-l{fill:#66666e;font-size:12px}</style><rect class="bg" x="-10" y="-10" width="940" height="340" rx="12"/><defs><marker id="ah-fregoli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dx-m" d="M0 0L10 5L0 10z"/></marker></defs><rect class="dx-reg" x="230" y="10" width="440" height="300" rx="14"/><text class="dx-rl" x="250" y="36" text-anchor="start">Node process · Cordis kernel</text><rect class="dx-box" x="20" y="56" width="150" height="56" rx="10"/><text class="dx-t" x="95.0" y="77.0" text-anchor="middle" dominant-baseline="middle">Browser</text><text class="dx-s" x="95.0" y="96.0" text-anchor="middle" dominant-baseline="middle">canvas + assistant</text><rect class="dx-box s" x="260" y="56" width="390" height="56" rx="10"/><text class="dx-t dx-on" x="455.0" y="77.0" text-anchor="middle" dominant-baseline="middle">web plugin</text><text class="dx-sub-on" x="455.0" y="96.0" text-