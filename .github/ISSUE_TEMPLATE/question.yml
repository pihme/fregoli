name: Question
description: Ask how something works or how to use it.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: The [readme](https://github.com/pihme/fregoli#readme) and the [website](https://pihme.github.io/fregoli/) may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you tried, version, how you run Fregoli.
