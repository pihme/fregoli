# Commit prefixes follow the release rules in AGENTS.md (.github/scripts/release.py):
#   runtime deps and the Docker base image -> fix(deps): patch release
#   dev deps -> chore(deps-dev), GitHub Actions -> ci(deps): no release
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      npm-dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
